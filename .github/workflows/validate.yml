name: Validate protocol state

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python test dependencies
        run: python -m pip install jsonschema

      - name: Validate repository dogfood instance
        run: python scripts/validate_collaboration_state.py --root .

      - name: Validate minimal example instance
        run: python scripts/validate_collaboration_state.py --root examples/minimal_instance

      - name: Validate repository dogfood instance with PowerShell
        shell: pwsh
        run: ./scripts/validate_collaboration_state.ps1 -Root .

      - name: Validate minimal example instance with PowerShell
        shell: pwsh
        run: ./scripts/validate_collaboration_state.ps1 -Root examples/minimal_instance

      - name: Scan encoding
        run: python scripts/scan_encoding.py --root .

      - name: Scan encoding with PowerShell
        shell: pwsh
        run: ./scripts/scan_encoding.ps1 -Root .

      - name: Run encoding gate cases
        run: python examples/encoding_gate_cases/run_encoding_gate_cases.py

      - name: Run handoff-release validation cases
        run: python examples/handoff_release_cases/run_handoff_release_cases.py

      - name: Run mailbox status validation cases
        run: python examples/mailbox_status_cases/run_mailbox_status_cases.py

      - name: Check systematic state pruning
        run: python scripts/prune_state.py --root . --check

      - name: Run SDD validation cases
        shell: pwsh
        run: ./examples/sdd_validation_cases/run_sdd_cases.ps1

      - name: Run compact communication validation cases
        shell: pwsh
        run: ./examples/compact_comms_validation_cases/run_compact_comms_cases.ps1

      - name: Run neutrality scan validation cases
        shell: pwsh
        run: ./examples/neutrality_scan_cases/run_neutrality_scan_cases.ps1

      - name: Run runtime router cases
        run: python examples/runtime_router_cases/run_runtime_router_cases.py

      - name: Run N-agent N=3/N=5 golden cases
        run: python examples/runtime_nagent_golden_cases/run_runtime_nagent_golden_cases.py

      - name: Run runtime property invariant cases
        run: python examples/runtime_property_cases/run_runtime_property_cases.py

      - name: Run runtime concurrency simulation cases
        run: python examples/runtime_concurrency_cases/run_runtime_concurrency_cases.py

      - name: Run runtime guardrail cases
        run: python examples/runtime_guardrail_cases/run_runtime_guardrail_cases.py

      - name: Run runtime event log cases
        run: python examples/runtime_eventlog_cases/run_runtime_eventlog_cases.py

      - name: Run runtime event log gate cases
        run: python examples/runtime_eventlog_gate_cases/run_runtime_eventlog_gate_cases.py

      - name: Run runtime Review/QA cases
        run: python examples/runtime_review_qa_cases/run_runtime_review_qa_cases.py

      - name: Run agent registry cases
        run: python examples/agent_registry_cases/run_agent_registry_cases.py

      - name: Run runtime turn schema cases
        run: python examples/runtime_turn_cases/run_runtime_turn_schema_cases.py

      - name: Run runtime turn semantic cases
        run: python examples/runtime_turn_cases/run_runtime_turn_semantic_cases.py

      - name: Run runtime apply cases
        run: python examples/runtime_apply_cases/run_runtime_apply_cases.py

      - name: Run runtime loop cases
        run: python examples/runtime_loop_cases/run_runtime_loop_cases.py

      - name: Run runtime observability cases
        run: python examples/runtime_observability_cases/run_runtime_observability_cases.py

      - name: Run LLM adapter recorded cases
        run: python examples/llm_adapter_cases/run_llm_adapter_cases.py

      - name: Scan domain neutrality
        run: python scripts/scan_domain_neutrality.py --root .

      - name: Scan domain neutrality with PowerShell
        shell: pwsh
        run: ./scripts/scan_domain_neutrality.ps1 -Root .
