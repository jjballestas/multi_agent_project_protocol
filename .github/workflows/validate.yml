name: Validate protocol state

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python test dependencies
        run: python -m pip install jsonschema

      - name: Validate repository dogfood instance
        run: python scripts/validate_collaboration_state.py --root .

      - name: Validate minimal example instance
        run: python scripts/validate_collaboration_state.py --root examples/minimal_instance

      - name: Validate repository dogfood instance with PowerShell
        shell: pwsh
        run: ./scripts/validate_collaboration_state.ps1 -Root .

      - name: Validate minimal example instance with PowerShell
        shell: pwsh
        run: ./scripts/validate_collaboration_state.ps1 -Root examples/minimal_instance

      - name: Check human guide template HTML
        run: python scripts/generate_human_guide.py --root . --in Area_comun/protocol/HUMAN_GUIDE.template.md --out Area_comun/protocol/HUMAN_GUIDE.template.html --kind template --check

      - name: Run human guide generator cases
        run: python examples/human_guide_cases/run_human_guide_cases.py

      - name: Scan encoding
        run: python scripts/scan_encoding.py --root .

      - name: Scan encoding with PowerShell
        shell: pwsh
        run: ./scripts/scan_encoding.ps1 -Root .

      - name: Run encoding gate cases
        run: python examples/encoding_gate_cases/run_encoding_gate_cases.py

      - name: Run handoff-release validation cases
        run: python examples/handoff_release_cases/run_handoff_release_cases.py

      - name: Run mailbox status validation cases
        run: python examples/mailbox_status_cases/run_mailbox_status_cases.py

      - name: Check systematic state pruning
        run: python scripts/prune_state.py --root . --check

      - name: Run runtime prune cases
        run: python examples/runtime_prune_cases/run_runtime_prune_cases.py

      - name: Run SDD validation cases
        shell: pwsh
        run: ./examples/sdd_validation_cases/run_sdd_cases.ps1

      - name: Run compact communication validation cases
        shell: pwsh
        run: ./examples/compact_comms_validation_cases/run_compact_comms_cases.ps1

      - name: Run neutrality scan validation cases
        shell: pwsh
        run: ./examples/neutrality_scan_cases/run_neutrality_scan_cases.ps1

      - name: Run SBOM generation cases
        run: python examples/sbom_cases/run_sbom_cases.py

      - name: Run release manifest verify cases
        run: python examples/release_verify_cases/run_release_verify_cases.py

      - name: Run provenance cases
        run: python examples/provenance_cases/run_provenance_cases.py

      - name: Run release signature cases
        run: python examples/release_sign_cases/run_release_sign_cases.py

      - name: Run runtime router cases
        run: python examples/runtime_router_cases/run_runtime_router_cases.py

      - name: Run N-agent N=3/N=5 golden cases
        run: python examples/runtime_nagent_golden_cases/run_runtime_nagent_golden_cases.py

      - name: Run runtime property invariant cases
        run: python examples/runtime_property_cases/run_runtime_property_cases.py

      - name: Run runtime concurrency simulation cases
        run: python examples/runtime_concurrency_cases/run_runtime_concurrency_cases.py

      - name: Run runtime guardrail cases
        run: python examples/runtime_guardrail_cases/run_runtime_guardrail_cases.py

      - name: Run runtime tool policy cases
        run: python examples/runtime_tool_policy_cases/run_runtime_tool_policy_cases.py

      - name: Run runtime event log cases
        run: python examples/runtime_eventlog_cases/run_runtime_eventlog_cases.py

      - name: Run runtime protocol replay cases
        run: python examples/runtime_protocol_replay_cases/run_runtime_protocol_replay_cases.py

      - name: Run runtime protocol materialize cases
        run: python examples/runtime_protocol_materialize_cases/run_runtime_protocol_materialize_cases.py

      - name: Run materialize cross-FS cases
        run: python examples/materialize_cross_fs_cases/run_materialize_cross_fs_cases.py

      - name: Run intent flow cases
        run: python examples/intent_flow_cases/run_intent_flow_cases.py

      - name: Run intent transaction cases
        run: python examples/intent_tx_cases/run_intent_tx_cases.py

      - name: Run Codex loop cutover cases
        run: python examples/cutover_loop_cases/run_cutover_loop_cases.py

      - name: Run runtime protocol enforce cases
        run: python examples/runtime_protocol_enforce_cases/run_runtime_protocol_enforce_cases.py

      - name: Run runtime protocol genesis-ref cases
        run: python examples/runtime_protocol_genesis_ref_cases/run_runtime_protocol_genesis_ref_cases.py

      - name: Run runtime event auth cases
        run: python examples/runtime_event_auth_cases/run_runtime_event_auth_cases.py

      - name: Run runtime instantiation cases
        run: python examples/runtime_instantiation_cases/run_runtime_instantiation_cases.py

      - name: Run runtime upgrade cases
        run: python examples/runtime_upgrade_cases/run_runtime_upgrade_cases.py

      - name: Run runtime event log gate cases
        run: python examples/runtime_eventlog_gate_cases/run_runtime_eventlog_gate_cases.py

      - name: Run runtime Review/QA cases
        run: python examples/runtime_review_qa_cases/run_runtime_review_qa_cases.py

      - name: Run agent registry cases
        run: python examples/agent_registry_cases/run_agent_registry_cases.py

      - name: Run runtime turn schema cases
        run: python examples/runtime_turn_cases/run_runtime_turn_schema_cases.py

      - name: Run runtime turn semantic cases
        run: python examples/runtime_turn_cases/run_runtime_turn_semantic_cases.py

      - name: Run runtime apply cases
        run: python examples/runtime_apply_cases/run_runtime_apply_cases.py

      - name: Run runtime loop cases
        run: python examples/runtime_loop_cases/run_runtime_loop_cases.py

      - name: Run supervised autonomy cases
        run: python examples/supervised_autonomy_cases/run_supervised_autonomy_cases.py

      - name: Run Agent Teams bridge cases
        run: python examples/team_bridge_cases/run_team_bridge_cases.py

      - name: Run runtime observability cases
        run: python examples/runtime_observability_cases/run_runtime_observability_cases.py

      - name: Run runtime budget cases
        run: python examples/runtime_budget_cases/run_runtime_budget_cases.py

      - name: Run N-agent observability cases
        run: python examples/runtime_observability_nagent_cases/run_runtime_observability_nagent_cases.py

      - name: Run LLM adapter recorded cases
        run: python examples/llm_adapter_cases/run_llm_adapter_cases.py

      - name: Run LLM turn wrapper cases
        run: python examples/llm_turn_wrapper_cases/run_llm_turn_wrapper_cases.py

      - name: Run LLM turn wrapper cases with PowerShell
        shell: pwsh
        run: ./examples/llm_turn_wrapper_cases/run_llm_turn_wrapper_cases.ps1

      - name: Run real adapter activation cases
        run: python examples/runtime_real_adapter_cases/run_runtime_real_adapter_cases.py

      - name: Scan domain neutrality
        run: python scripts/scan_domain_neutrality.py --root .

      - name: Scan domain neutrality with PowerShell
        shell: pwsh
        run: ./scripts/scan_domain_neutrality.ps1 -Root .
