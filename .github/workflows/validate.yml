name: Validate protocol state

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate repository dogfood instance
        run: python scripts/validate_collaboration_state.py --root .

      - name: Validate minimal example instance
        run: python scripts/validate_collaboration_state.py --root examples/minimal_instance

      - name: Validate repository dogfood instance with PowerShell
        shell: pwsh
        run: ./scripts/validate_collaboration_state.ps1 -Root .

      - name: Validate minimal example instance with PowerShell
        shell: pwsh
        run: ./scripts/validate_collaboration_state.ps1 -Root examples/minimal_instance

      - name: Scan encoding
        run: python scripts/scan_encoding.py --root .

      - name: Scan encoding with PowerShell
        shell: pwsh
        run: ./scripts/scan_encoding.ps1 -Root .

      - name: Run encoding gate cases
        run: python examples/encoding_gate_cases/run_encoding_gate_cases.py

      - name: Run handoff-release validation cases
        run: python examples/handoff_release_cases/run_handoff_release_cases.py

      - name: Check systematic state pruning
        run: python scripts/prune_state.py --root . --check

      - name: Run SDD validation cases
        shell: pwsh
        run: ./examples/sdd_validation_cases/run_sdd_cases.ps1

      - name: Run compact communication validation cases
        shell: pwsh
        run: ./examples/compact_comms_validation_cases/run_compact_comms_cases.ps1

      - name: Run neutrality scan validation cases
        shell: pwsh
        run: ./examples/neutrality_scan_cases/run_neutrality_scan_cases.ps1

      - name: Scan domain neutrality
        run: python scripts/scan_domain_neutrality.py --root .

      - name: Scan domain neutrality with PowerShell
        shell: pwsh
        run: ./scripts/scan_domain_neutrality.ps1 -Root .
