name: Self-hosted probe

# Experimento acotado: comprobar si un job en runner PROPIO arranca mientras la
# cuenta tiene agotado el cupo de minutos de GitHub-hosted. El job de control
# corre en ubuntu-latest a proposito: si el control queda bloqueado y los dos
# jobs self-hosted ejecutan sus pasos, la respuesta esta medida en el MISMO run.
# Se dispara solo al tocar este fichero, o a mano. No anade ruido a cada push.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/selfhosted-probe.yml

jobs:
  control-hosted:
    name: control (GitHub-hosted, se espera BLOQUEADO)
    runs-on: ubuntu-latest
    steps:
      - name: Marca de arranque
        run: echo "CONTROL_STARTED=yes"

  probe-windows:
    name: probe (self-hosted Windows)
    runs-on: [self-hosted, protocol-win]
    steps:
      - name: Marca de arranque
        shell: cmd
        run: echo PROBE_WIN_STARTED=yes

      - name: Checkout
        uses: actions/checkout@v4

      - name: Interprete y version
        shell: pwsh
        run: |
          Write-Host "psversion=$($PSVersionTable.PSVersion)"
          Write-Host "edition=$($PSVersionTable.PSEdition)"
          python --version

      - name: Windows PowerShell 5.1 disponible (lo que exige falsification-runners)
        shell: cmd
        run: powershell.exe -NoProfile -Command "$PSVersionTable.PSVersion.ToString()"

      - name: Gate real -- scan_encoding
        run: python scripts/scan_encoding.py --root .

  probe-linux:
    name: probe (self-hosted Linux)
    runs-on: [self-hosted, protocol-linux]
    steps:
      - name: Marca de arranque
        run: echo "PROBE_LINUX_STARTED=yes"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Interprete y version
        run: |
          uname -sr
          python3 --version
          pwsh --version

      - name: Gate real -- scan_encoding
        run: python3 scripts/scan_encoding.py --root .

      - name: Paridad -- el escaner PowerShell sobre Linux
        shell: pwsh
        run: ./scripts/scan_encoding.ps1 -Root .
