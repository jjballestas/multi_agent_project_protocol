<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Zeus-Aegis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c75e"/>
      <stop offset="1" stop-color="#e3b341"/>
    </linearGradient>
  </defs>

  <!-- rounded-square app tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="107.5" fill="none" stroke="#2a3441" stroke-width="3"/>

  <!-- aegis / shield -->
  <path d="M256 84
           L404 138
           V268
           C404 350 340 410 256 440
           C172 410 108 350 108 268
           V138 Z"
        fill="none" stroke="#58a6ff" stroke-width="14" stroke-linejoin="round" opacity="0.85"/>
  <path d="M256 110
           L380 155
           V266
           C380 336 326 388 256 414
           C186 388 132 336 132 266
           V155 Z"
        fill="#11161d" stroke="#1f6feb" stroke-width="4" stroke-linejoin="round" opacity="0.7"/>

  <!-- Zeus lightning bolt (clean, centered in the aegis) -->
  <path d="M198.5 147
           L198.5 273.5
           L233 273.5
           L233 377
           L313.5 239
           L267.5 239
           L313.5 147 Z"
        fill="url(#bolt)" stroke="#0d1117" stroke-width="6" stroke-linejoin="round"/>
</svg>
